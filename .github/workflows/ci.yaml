name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SAMPLE_ONLY: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # The smoke test builds a real index, so it downloads all-MiniLM-L6-v2
      # (~90MB) from Hugging Face at test time. Caching it keeps a transient
      # download failure from turning into a red build.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503,E203

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
